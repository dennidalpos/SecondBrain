name: CLI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Minimum Rust version and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the minimum supported Rust version
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --all-targets
      - name: Audit locked dependencies
        run: |
          cargo +stable install cargo-audit --locked --version 0.23.0
          cargo audit

  test:
    name: sb on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: cli
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable Rust toolchain with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build and smoke run
        run: |
          cargo build --locked --release
          bin=target/release/sb
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          home="$RUNNER_TEMP/sb-home"
          "$bin" --home "$home" init
          "$bin" --home "$home" repos
          ls -l "$bin"
